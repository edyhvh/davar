# Davar Mobile App - Complete UI Specification for Expo/React Native
# Design System: Kadosh Minimalism with Neumorphic Elements
# Platform: React Native (Expo)
# Target Devices: iPhone 14 Pro (393×852), Pixel 7 (412×915)

# =============================================================================
# DESIGN TOKENS
# =============================================================================
design_tokens:
  colors:
    light:
      primary: "#7AA0D6" # Soft earthy tekhelet (airy pastel blue)
      primary_dark: "#6389BF" # Hover/pressed state
      primary_deep: "#4C72A8" # Deep pressed state
      primary_light: "#A8C8F0" # Soft fills, selected states
      primary_darker: "#3D5A8C" # Donate button darker blue

      secondary: "#B07A3C" # Softened copper (main accent)
      secondary_highlight: "#C68F55" # Qumran variant highlighting

      background: "#FDFDF9" # Warm ivory page background
      surface: "#FFFFFF" # Card surfaces, modals
      surface_elevated: "#F8F7F3" # Raised surfaces

      text_primary: "#1a1a1a" # Main text, Hebrew scripture
      text_secondary: "#6b6b6b" # Secondary text, labels

      border: "rgba(0, 0, 0, 0.08)" # Dividers, input borders

      # Neumorphic shadows
      neomorph_bg: "#FDFDF9"
      shadow_dark: "rgba(190, 190, 200, 0.4)"
      shadow_light: "rgba(255, 255, 255, 0.8)"
      neomorph_border: "rgba(200, 200, 220, 0.2)"

    dark:
      primary: "#92B5E8"
      primary_dark: "#7B9ED1"
      primary_deep: "#4C72A8"
      primary_light: "#BCD8FF"
      primary_darker: "#3D5A8C"

      secondary: "#A06C35"
      secondary_highlight: "#B5814A"

      background: "#0F0E12" # Warm deep charcoal
      surface: "#17161A" # Elevated surface
      surface_elevated: "#1F1E23" # Raised surfaces

      text_primary: "#ebdbb2" # Warm cream text
      text_secondary: "#a89984" # Secondary text

      border: "rgba(255, 255, 255, 0.10)"

      # Neumorphic shadows
      neomorph_bg: "#17161A"
      shadow_dark: "rgba(0, 0, 0, 0.5)"
      shadow_light: "rgba(40, 40, 50, 0.3)"
      neomorph_border: "rgba(70, 80, 110, 0.25)"

  typography:
    fonts:
      hebrew_scripture: "Cardo" # Main Hebrew Bible text
      hebrew_ui: "Arimo" # Hebrew UI labels, book names
      latin_ui: "Inter" # English UI, settings, labels
      logo: "Suez One" # Brand logo text

    sizes:
      hebrew_verse: 48 # Main verse display (adjustable 36-56)
      hebrew_word_analysis: 28 # Word in bottom sheet
      h1: 28
      h2: 24
      h3: 20
      body: 16
      body_small: 14
      caption: 12
      logo: 36

    weights:
      regular: "400"
      medium: "500"
      semibold: "600"
      bold: "700"

    line_heights:
      hebrew_scripture: 1.8 # Extra space for nikud (diacritics)
      body: 1.5
      tight: 1.3

  spacing:
    xs: 4
    sm: 8
    md: 12
    base: 16
    lg: 20
    xl: 24
    xxl: 32
    xxxl: 40
    huge: 48
    massive: 64

  safe_areas:
    ios:
      top: 44 # iPhone X+ notch
      bottom: 34 # Home indicator gesture bar
    android:
      top: 24 # Status bar
      bottom: 0 # Software buttons outside screen

  border_radius:
    sm: 8
    md: 12
    lg: 16
    xl: 24
    full: 999 # Pill shape

  shadows:
    # iOS shadows (use with shadowColor, shadowOffset, shadowOpacity, shadowRadius)
    ios:
      neumorphic_raised:
        shadow_color: "#000"
        shadow_offset:
          width: 6
          height: 6
        shadow_opacity: 0.3
        shadow_radius: 12
        # Secondary light shadow (layer 2)
        light_shadow_offset:
          width: -6
          height: -6
        light_shadow_opacity: 0.7

      subtle:
        shadow_color: "#000"
        shadow_offset:
          width: 0
          height: 2
        shadow_opacity: 0.1
        shadow_radius: 4

    # Android elevation (use with elevation property)
    android:
      card: 4
      modal: 8
      bottom_sheet: 12

  animations:
    durations:
      instant: 100 # Button press feedback
      fast: 150 # Word highlight
      quick: 200 # Hints, small transitions
      normal: 300 # Screen transitions, swipes
      slow: 400 # Bottom sheet open/close
      splash: 1500 # Splash screen duration

    easing:
      ease_out: "cubic-bezier(0, 0, 0.2, 1)"
      ease_in_out: "cubic-bezier(0.4, 0, 0.2, 1)"
      spring:
        damping: 0.8
        stiffness: 100

# =============================================================================
# SCREEN 1: SPLASH / LAUNCH SCREEN
# =============================================================================
screens:
  splash_screen:
    name: "SplashScreen"
    route: "Splash"
    description: "Initial launch screen with logo, shown for 1.5-2 seconds before transitioning to Home"

    layout:
      flex: 1
      background_color: "{{colors.background}}"
      justify_content: "center"
      align_items: "center"
      padding: 24

    components:
      - type: "View"
        name: "LogoContainer"
        style:
          align_items: "center"
          gap: 16

        children:
          - type: "SVG"
            name: "DaletLogo"
            description: "Phoenician Dalet logo (ד symbol)"
            width: 80
            height: 80
            fill: "{{colors.secondary}}"

          - type: "Text"
            name: "AppName"
            text: "Davar"
            style:
              font_family: "{{fonts.logo}}"
              font_size: 36
              color: "{{colors.secondary}}"
              letter_spacing: 1.5

          - type: "Text"
            name: "Tagline"
            text: "Hebrew Scripture Study"
            style:
              font_family: "{{fonts.latin_ui}}"
              font_size: 14
              color: "{{colors.text_secondary}}"
              margin_top: 8

    animation:
      sequence:
        - step: "fade_in_logo"
          duration: 400
          easing: "ease_out"
          properties:
            opacity: [0, 1]

        - step: "hold"
          duration: 1100

        - step: "fade_to_home"
          duration: 600
          easing: "ease_in_out"
          navigate_to: "Home"

  # =============================================================================
  # SCREEN 2: HOME / LIBRARY SCREEN
  # =============================================================================
  home_screen:
    name: "HomeScreen"
    route: "Home"
    description: "Main library view showing recent verses in scrollable list with bottom navigation"

    layout:
      flex: 1
      background_color: "{{colors.background}}"

    structure:
      - section: "header"
        position: "fixed_top"
        safe_area_top: true

      - section: "content"
        position: "scrollable"
        flex: 1

      - section: "navigation"
        position: "fixed_bottom"
        safe_area_bottom: true

    sections:
      header:
        type: "View"
        style:
          padding_top: "{{safe_areas.ios.top}}" # or android top
          padding_horizontal: 24
          padding_bottom: 16
          align_items: "center"
          background_color: "{{colors.background}}"

        components:
          - type: "View"
            name: "HeaderContent"
            style:
              flex_direction: "row"
              align_items: "center"
              gap: 12

            children:
              - type: "SVG"
                name: "MiniDaletLogo"
                width: 24
                height: 24
                fill: "{{colors.secondary}}"

              - type: "Text"
                name: "AppTitle"
                text: "Davar"
                style:
                  font_family: "{{fonts.logo}}"
                  font_size: 24
                  color: "{{colors.text_primary}}"

          - type: "Text"
            name: "SubTitle"
            text: "Recent Study"
            style:
              font_family: "{{fonts.latin_ui}}"
              font_size: 14
              color: "{{colors.text_secondary}}"
              margin_top: 8

      content:
        type: "ScrollView"
        name: "VerseList"
        style:
          flex: 1
          padding_horizontal: 24
          padding_vertical: 16

        scroll_props:
          show_vertical_scroll_indicator: false
          content_inset:
            top: 0
            bottom: 100 # Space for bottom nav + margin

        children:
          # Verse cards are dynamically generated from data
          # Each card uses the VerseCard component (defined in components section)
          - type: "Component"
            component_ref: "verse_card"
            repeat: true
            data_source: "recent_verses"
            gap: 16

# =============================================================================
# COMPONENT: VERSE CARD (for Home screen)
# =============================================================================
components:
  verse_card:
    name: "VerseCard"
    description: "Neumorphic card showing verse snippet, used in Home/Library and Search results"

    container:
      type: "TouchableOpacity"
      active_opacity: 0.9
      style:
        background_color: "{{colors.neomorph_bg}}"
        border_radius: "{{border_radius.xl}}"
        padding: 24
        margin_bottom: 16
        border_width: 1
        border_color: "{{colors.neomorph_border}}"

        # Neumorphic shadow (iOS)
        shadow_color: "{{colors.shadow_dark}}"
        shadow_offset:
          width: 6
          height: 6
        shadow_opacity: 0.3
        shadow_radius: 12

        # Android elevation
        elevation: 4

      press_behavior:
        scale: 0.97
        duration: 100
        on_press: "navigate_to_verse_detail"

    layout:
      flex_direction: "column"
      gap: 12

    children:
      - type: "View"
        name: "CardHeader"
        style:
          flex_direction: "row"
          justify_content: "space-between"
          align_items: "center"

        children:
          - type: "Text"
            name: "BookName"
            text: "{{verse.book}}"
            style:
              font_family: "{{fonts.latin_ui}}"
              font_size: 16
              font_weight: "{{weights.semibold}}"
              color: "{{colors.text_primary}}"

          - type: "Text"
            name: "Reference"
            text: "{{verse.chapter}}:{{verse.verse}}"
            style:
              font_family: "{{fonts.latin_ui}}"
              font_size: 14
              color: "{{colors.text_secondary}}"

      - type: "Text"
        name: "HebrewSnippet"
        text: "{{verse.hebrew_text}}"
        style:
          font_family: "{{fonts.hebrew_scripture}}"
          font_size: 24
          line_height: 1.8
          color: "{{colors.text_primary}}"
          text_align: "right"
          writing_direction: "rtl"

        number_of_lines: 2
        ellipsize_mode: "tail"

      - type: "Text"
        name: "TranslationPreview"
        text: "{{verse.translation}}"
        style:
          font_family: "{{fonts.latin_ui}}"
          font_size: 14
          line_height: 1.5
          color: "{{colors.text_secondary}}"
          margin_top: 4

        number_of_lines: 2
        ellipsize_mode: "tail"

  # =============================================================================
  # SCREEN 3: VERSE DETAIL SCREEN
  # =============================================================================
  verse_detail_screen:
    name: "VerseDetailScreen"
    route: "VerseDetail"
    description: "Full-screen immersive verse reading with TikTok-style vertical swipe navigation"

    layout:
      flex: 1
      background_color: "{{colors.background}}"

    gesture_handling:
      swipe_up:
        action: "navigate_to_previous_verse"
        threshold: 50
        animation_duration: 300

      swipe_down:
        action: "navigate_to_next_verse"
        threshold: 50
        animation_duration: 300

    structure:
      - section: "top_bar"
        position: "fixed_top"
        safe_area_top: true

      - section: "verse_content"
        position: "centered"
        flex: 1

      - section: "bottom_toolbar"
        position: "fixed"
        bottom: 116 # Above nav bar + separator

      - section: "swipe_indicator"
        position: "fixed"
        bottom: 100 # Just above toolbar

    sections:
      top_bar:
        type: "View"
        style:
          padding_top: "{{safe_areas.ios.top}}"
          padding_horizontal: 24
          padding_bottom: 12
          align_items: "center"

        components:
          - type: "TouchableOpacity"
            name: "BookChapterSelector"
            on_press: "open_book_selector_modal"
            style:
              background_color: "{{colors.surface}}"
              border_radius: "{{border_radius.full}}"
              border_width: 1.5
              border_color: "{{colors.border}}"
              padding_vertical: 8
              padding_horizontal: 20
              flex_direction: "row"
              align_items: "center"
              gap: 8

            children:
              - type: "Text"
                name: "BookNameHebrew"
                text: "{{verse.book_hebrew}}"
                style:
                  font_family: "{{fonts.hebrew_ui}}"
                  font_size: 14
                  color: "{{colors.text_primary}}"

              - type: "Text"
                name: "ChapterVerse"
                text: "{{verse.chapter}}:{{verse.verse}}"
                style:
                  font_family: "{{fonts.latin_ui}}"
                  font_size: 14
                  font_weight: "{{weights.medium}}"
                  color: "{{colors.text_secondary}}"

              - type: "Icon"
                name: "chevron-down"
                size: 16
                color: "{{colors.text_secondary}}"

      verse_content:
        type: "View"
        style:
          flex: 1
          justify_content: "center"
          align_items: "center"
          padding_horizontal: 24
          max_width: 360
          align_self: "center"

        components:
          - type: "View"
            name: "HebrewTextContainer"
            style:
              width: "100%"
              align_items: "center"

            children:
              # Hebrew words are rendered individually for tap interaction
              - type: "Component"
                component_ref: "hebrew_word_interactive"
                repeat: true
                data_source: "verse.words"
                wrap: true
                gap: 8

          - type: "Text"
            name: "Translation"
            text: "{{verse.translation}}"
            style:
              font_family: "{{fonts.latin_ui}}"
              font_size: 16
              line_height: 1.5
              color: "{{colors.text_secondary}}"
              text_align: "center"
              margin_top: 24
              max_width: 360

            visible: "{{!settings.hebrew_only}}"

          - type: "Text"
            name: "VerseReference"
            text: "{{verse.book}} {{verse.chapter}}:{{verse.verse}}"
            style:
              font_family: "{{fonts.latin_ui}}"
              font_size: 12
              color: "{{colors.text_secondary}}"
              margin_top: 16
              opacity: 0.7

      bottom_toolbar:
        type: "View"
        style:
          position: "absolute"
          bottom: 116
          left: 0
          right: 0
          flex_direction: "row"
          justify_content: "center"
          align_items: "center"
          gap: 16
          padding_horizontal: 24

        components:
          - type: "Component"
            component_ref: "icon_button"
            props:
              icon: "eye"
              active: "{{settings.show_qumran}}"
              on_press: "toggle_qumran_variants"

          - type: "Component"
            component_ref: "icon_button"
            props:
              icon: "bookmark"
              active: "{{verse.is_bookmarked}}"
              on_press: "toggle_bookmark"

          - type: "Component"
            component_ref: "icon_button"
            props:
              icon: "share"
              on_press: "share_verse"

      swipe_indicator:
        type: "View"
        name: "SwipeSeparatorLine"
        style:
          position: "absolute"
          bottom: 100
          left: 0
          right: 0
          height: 1
          background_color: "#999999"

        # First-time hint (shows only on initial app use)
        hint:
          type: "Text"
          text: "Swipe for next verse"
          style:
            font_family: "{{fonts.latin_ui}}"
            font_size: 12
            color: "{{colors.text_secondary}}"
            opacity: 0.5
            position: "absolute"
            bottom: 8
            align_self: "center"

          animation:
            type: "fade_in_out"
            duration: 300
            loop: 3
            delay: 500

          show_once: true
          storage_key: "has_seen_swipe_hint"

  # =============================================================================
  # COMPONENT: HEBREW WORD (Interactive)
  # =============================================================================
  hebrew_word_interactive:
    name: "HebrewWordInteractive"
    description: "Individual Hebrew word that highlights on tap and opens word analysis"

    container:
      type: "TouchableOpacity"
      active_opacity: 0.8
      style:
        padding_horizontal: 4
        padding_vertical: 2
        border_radius: 4

      press_behavior:
        on_press: "open_word_analysis"
        highlight_duration: 150
        highlight_color: "{{colors.secondary_highlight}}"
        highlight_opacity: 0.3

    children:
      - type: "Text"
        name: "WordText"
        text: "{{word.hebrew}}"
        style:
          font_family: "{{fonts.hebrew_scripture}}"
          font_size: "{{settings.hebrew_font_size}}" # 36-56pt adjustable
          line_height: 1.8
          color: "{{colors.text_primary}}"
          text_align: "right"
          writing_direction: "rtl"

        # Qumran variant highlighting
        variant_style:
          condition: "{{word.has_qumran_variant && settings.show_qumran}}"
          background_color: "{{colors.secondary_highlight}}"
          background_opacity: 0.15
          border_radius: 4
          padding: 2

  # =============================================================================
  # COMPONENT: ICON BUTTON (for toolbar)
  # =============================================================================
  icon_button:
    name: "IconButton"
    description: "Circular icon button with active/inactive states"

    container:
      type: "TouchableOpacity"
      active_opacity: 0.7
      style:
        width: 44
        height: 44
        border_radius: "{{border_radius.full}}"
        justify_content: "center"
        align_items: "center"
        background_color: "{{props.active ? colors.primary_light : 'transparent'}}"

      press_behavior:
        scale: 0.9
        duration: 100

    children:
      - type: "Icon"
        name: "{{props.icon}}"
        size: 24
        color: "{{props.active ? colors.primary : colors.text_secondary}}"

# =============================================================================
# BOTTOM SHEET: WORD ANALYSIS
# =============================================================================
bottom_sheets:
  word_analysis:
    name: "WordAnalysisBottomSheet"
    description: "Draggable bottom sheet showing Hebrew word analysis with dictionary info"

    behavior:
      max_height: "80%"
      min_height: 400
      snap_points: ["40%", "80%"]
      backdrop_opacity: 0.5
      backdrop_color: "#000000"
      backdrop_dismisses: true
      drag_indicator: true

    container:
      background_color: "{{colors.surface}}"
      border_top_left_radius: "{{border_radius.xl}}"
      border_top_right_radius: "{{border_radius.xl}}"
      shadow_color: "#000"
      shadow_offset:
        width: 0
        height: -4
      shadow_opacity: 0.2
      shadow_radius: 12
      elevation: "{{shadows.android.bottom_sheet}}"

    header:
      type: "View"
      style:
        padding_top: 12
        padding_horizontal: 24
        padding_bottom: 16
        align_items: "center"

      components:
        - type: "View"
          name: "DragHandle"
          style:
            width: 32
            height: 4
            border_radius: "{{border_radius.full}}"
            background_color: "{{colors.border}}"
            margin_bottom: 12

        - type: "View"
          name: "CloseButton"
          style:
            position: "absolute"
            top: 12
            right: 16

          children:
            - type: "TouchableOpacity"
              on_press: "close_bottom_sheet"
              style:
                width: 32
                height: 32
                border_radius: "{{border_radius.full}}"
                justify_content: "center"
                align_items: "center"

              children:
                - type: "Icon"
                  name: "x"
                  size: 20
                  color: "{{colors.text_secondary}}"

    content:
      type: "ScrollView"
      style:
        flex: 1
        padding_horizontal: 24
        padding_bottom: 24

      show_vertical_scroll_indicator: true

      sections:
        - section: "word_header"
          margin_bottom: 24

        - section: "meanings"
          margin_bottom: 24

        - section: "root_section"
          margin_bottom: 24

        - section: "instances"
          margin_bottom: 24

    sections:
      word_header:
        components:
          - type: "Text"
            name: "HebrewWord"
            text: "{{word.hebrew}}"
            style:
              font_family: "{{fonts.hebrew_scripture}}"
              font_size: 28
              color: "{{colors.text_primary}}"
              text_align: "center"
              writing_direction: "rtl"
              line_height: 1.8

          - type: "Text"
            name: "Transliteration"
            text: "{{word.transliteration}}"
            style:
              font_family: "{{fonts.latin_ui}}"
              font_size: 14
              color: "{{colors.text_secondary}}"
              text_align: "center"
              margin_top: 8
              font_style: "italic"

      meanings:
        components:
          - type: "Text"
            name: "MeaningsHeader"
            text: "Meanings"
            style:
              font_family: "{{fonts.latin_ui}}"
              font_size: 16
              font_weight: "{{weights.semibold}}"
              color: "{{colors.text_primary}}"
              margin_bottom: 12

          - type: "FlatList"
            data: "{{word.meanings}}"
            gap: 8

            item_render:
              type: "View"
              style:
                flex_direction: "row"
                gap: 8

              children:
                - type: "Text"
                  text: "•"
                  style:
                    font_family: "{{fonts.latin_ui}}"
                    font_size: 16
                    color: "{{colors.text_secondary}}"

                - type: "Text"
                  text: "{{item}}"
                  style:
                    font_family: "{{fonts.latin_ui}}"
                    font_size: 16
                    color: "{{colors.text_primary}}"
                    flex: 1

      root_section:
        components:
          - type: "View"
            name: "RootContainer"
            style:
              background_color: "{{colors.secondary_highlight}}"
              background_opacity: 0.1
              border_radius: "{{border_radius.md}}"
              padding: 16
              border_width: 1
              border_color: "{{colors.secondary_highlight}}"
              border_opacity: 0.2

            children:
              - type: "Text"
                name: "RootLabel"
                text: "Root"
                style:
                  font_family: "{{fonts.latin_ui}}"
                  font_size: 12
                  font_weight: "{{weights.semibold}}"
                  color: "{{colors.secondary}}"
                  text_transform: "uppercase"
                  letter_spacing: 0.5
                  margin_bottom: 8

              - type: "Text"
                name: "RootWord"
                text: "{{word.root}}"
                style:
                  font_family: "{{fonts.hebrew_scripture}}"
                  font_size: 24
                  color: "{{colors.text_primary}}"
                  text_align: "right"
                  writing_direction: "rtl"
                  line_height: 1.8
                  margin_bottom: 4

              - type: "Text"
                name: "RootTransliteration"
                text: "{{word.root_transliteration}}"
                style:
                  font_family: "{{fonts.latin_ui}}"
                  font_size: 12
                  color: "{{colors.text_secondary}}"
                  font_style: "italic"
                  margin_bottom: 8

              - type: "Text"
                name: "RootMeaning"
                text: "{{word.root_meaning}}"
                style:
                  font_family: "{{fonts.latin_ui}}"
                  font_size: 14
                  color: "{{colors.text_primary}}"

      instances:
        components:
          - type: "Text"
            name: "InstancesHeader"
            text: "Appears in:"
            style:
              font_family: "{{fonts.latin_ui}}"
              font_size: 16
              font_weight: "{{weights.semibold}}"
              color: "{{colors.text_primary}}"
              margin_bottom: 12

          - type: "FlatList"
            data: "{{word.instances}}"
            gap: 12

            item_render:
              type: "TouchableOpacity"
              on_press: "navigate_to_verse"
              on_press_data: "{{item.verse_ref}}"
              active_opacity: 0.7
              style:
                padding: 12
                background_color: "{{colors.surface_elevated}}"
                border_radius: "{{border_radius.md}}"
                border_width: 1
                border_color: "{{colors.border}}"

              children:
                - type: "Text"
                  name: "VerseRef"
                  text: "{{item.verse}}"
                  style:
                    font_family: "{{fonts.latin_ui}}"
                    font_size: 14
                    font_weight: "{{weights.semibold}}"
                    color: "{{colors.primary}}"
                    margin_bottom: 4

                - type: "Text"
                  name: "VerseSnippet"
                  text: "{{item.text}}"
                  style:
                    font_family: "{{fonts.latin_ui}}"
                    font_size: 14
                    color: "{{colors.text_secondary}}"
                    line_height: 1.5

  # =============================================================================
  # SCREEN 4: SEARCH SCREEN
  # =============================================================================
  search_screen:
    name: "SearchScreen"
    route: "Search"
    description: "RTL-compatible search with live results showing verse cards"

    layout:
      flex: 1
      background_color: "{{colors.background}}"

    structure:
      - section: "search_header"
        position: "fixed_top"
        safe_area_top: true

      - section: "search_results"
        position: "scrollable"
        flex: 1

    sections:
      search_header:
        type: "View"
        style:
          padding_top: "{{safe_areas.ios.top}}"
          padding_horizontal: 24
          padding_bottom: 16
          background_color: "{{colors.background}}"
          border_bottom_width: 1
          border_bottom_color: "{{colors.border}}"

        components:
          - type: "View"
            name: "SearchInputContainer"
            style:
              background_color: "{{colors.surface}}"
              border_radius: "{{border_radius.md}}"
              border_width: 2
              border_color: "{{colors.border}}"
              flex_direction: "row"
              align_items: "center"
              padding_horizontal: 16
              height: 48

            focus_style:
              border_color: "{{colors.primary}}"
              shadow_color: "{{colors.primary}}"
              shadow_offset:
                width: 0
                height: 0
              shadow_opacity: 0.2
              shadow_radius: 8

            children:
              - type: "Icon"
                name: "search"
                size: 20
                color: "{{colors.text_secondary}}"
                margin_right: 12

              - type: "TextInput"
                name: "SearchInput"
                placeholder: "Search Hebrew or English..."
                placeholder_text_color: "{{colors.text_secondary}}"
                style:
                  flex: 1
                  font_family: "{{fonts.latin_ui}}"
                  font_size: 16
                  color: "{{colors.text_primary}}"
                  # RTL switches based on first character
                  text_align: "{{input.is_rtl ? 'right' : 'left'}}"
                  writing_direction: "{{input.is_rtl ? 'rtl' : 'ltr'}}"

                auto_focus: true
                auto_correct: false
                clear_button_mode: "while_editing"
                return_key_type: "search"
                on_change_text: "handle_search_query"
                debounce: 300

      search_results:
        type: "View"
        style:
          flex: 1

        states:
          empty:
            condition: "{{search_query.length === 0}}"
            component:
              type: "View"
              style:
                flex: 1
                justify_content: "center"
                align_items: "center"
                padding: 48

              children:
                - type: "Icon"
                  name: "search"
                  size: 48
                  color: "{{colors.text_secondary}}"
                  opacity: 0.3

                - type: "Text"
                  text: "Start typing to search..."
                  style:
                    font_family: "{{fonts.latin_ui}}"
                    font_size: 16
                    color: "{{colors.text_secondary}}"
                    margin_top: 16
                    text_align: "center"

          no_results:
            condition: "{{search_query.length > 0 && results.length === 0}}"
            component:
              type: "View"
              style:
                flex: 1
                justify_content: "center"
                align_items: "center"
                padding: 48

              children:
                - type: "Text"
                  text: "No results found"
                  style:
                    font_family: "{{fonts.latin_ui}}"
                    font_size: 16
                    color: "{{colors.text_secondary}}"

          results:
            condition: "{{results.length > 0}}"
            component:
              type: "FlatList"
              data: "{{results}}"
              style:
                padding_horizontal: 24
                padding_vertical: 16

              content_inset:
                bottom: 100

              item_separator:
                height: 16

              item_render:
                type: "Component"
                component_ref: "search_result_card"

  # =============================================================================
  # COMPONENT: SEARCH RESULT CARD
  # =============================================================================
  search_result_card:
    name: "SearchResultCard"
    description: "Compact verse card for search results with match highlighting"

    container:
      type: "TouchableOpacity"
      active_opacity: 0.9
      on_press: "navigate_to_verse_detail"
      style:
        background_color: "{{colors.surface}}"
        border_radius: "{{border_radius.lg}}"
        padding: 16
        border_width: 1
        border_color: "{{colors.border}}"
        shadow_color: "#000"
        shadow_offset:
          width: 0
          height: 2
        shadow_opacity: 0.1
        shadow_radius: 4
        elevation: 2

    children:
      - type: "View"
        name: "Header"
        style:
          flex_direction: "row"
          justify_content: "space-between"
          margin_bottom: 8

        children:
          - type: "Text"
            text: "{{result.book}} {{result.chapter}}:{{result.verse}}"
            style:
              font_family: "{{fonts.latin_ui}}"
              font_size: 14
              font_weight: "{{weights.semibold}}"
              color: "{{colors.primary}}"

      - type: "Text"
        name: "HebrewMatch"
        text: "{{result.hebrew_snippet}}"
        style:
          font_family: "{{fonts.hebrew_scripture}}"
          font_size: 18
          line_height: 1.8
          color: "{{colors.text_primary}}"
          text_align: "right"
          writing_direction: "rtl"
          margin_bottom: 8

        # Highlight matched term
        highlight_ranges: "{{result.match_ranges}}"
        highlight_style:
          background_color: "{{colors.secondary_highlight}}"
          background_opacity: 0.3

      - type: "Text"
        name: "TranslationMatch"
        text: "{{result.translation_snippet}}"
        style:
          font_family: "{{fonts.latin_ui}}"
          font_size: 14
          color: "{{colors.text_secondary}}"
          line_height: 1.5

        number_of_lines: 2
        ellipsize_mode: "tail"

  # =============================================================================
  # SCREEN 5: SETTINGS SCREEN
  # =============================================================================
  settings_screen:
    name: "SettingsScreen"
    route: "Settings"
    description: "App preferences with toggles, sliders, and dropdowns"

    layout:
      flex: 1
      background_color: "{{colors.background}}"

    structure:
      - section: "header"
        position: "fixed_top"
        safe_area_top: true

      - section: "settings_list"
        position: "scrollable"
        flex: 1

    sections:
      header:
        type: "View"
        style:
          padding_top: "{{safe_areas.ios.top}}"
          padding_horizontal: 24
          padding_bottom: 16
          border_bottom_width: 1
          border_bottom_color: "{{colors.border}}"

        components:
          - type: "Text"
            text: "Settings"
            style:
              font_family: "{{fonts.latin_ui}}"
              font_size: 28
              font_weight: "{{weights.bold}}"
              color: "{{colors.text_primary}}"

      settings_list:
        type: "ScrollView"
        style:
          flex: 1

        content_inset:
          bottom: 100

        items:
          - type: "Component"
            component_ref: "settings_section_header"
            props:
              text: "GENERAL"

          - type: "Component"
            component_ref: "settings_item_toggle"
            props:
              icon: "sun"
              label: "Dark Mode"
              description: "Switch between light and dark themes"
              value: "{{settings.theme === 'dark'}}"
              on_change: "toggle_theme"

          - type: "View"
            name: "Divider"
            style:
              height: 1
              background_color: "{{colors.border}}"
              margin_horizontal: 24

          - type: "Component"
            component_ref: "settings_item_dropdown"
            props:
              icon: "globe"
              label: "Language"
              description: "App interface language"
              value: "{{settings.language}}"
              options:
                - value: "en"
                  label: "English"
                - value: "es"
                  label: "Español"
                - value: "he"
                  label: "עברית"
              on_change: "change_language"

          - type: "View"
            name: "Divider"
            style:
              height: 1
              background_color: "{{colors.border}}"
              margin_horizontal: 24

          - type: "Component"
            component_ref: "settings_item_slider"
            props:
              icon: "type"
              label: "Hebrew Text Size"
              description: "{{settings.hebrew_font_size}}pt"
              value: "{{settings.hebrew_font_size}}"
              min_value: 36
              max_value: 56
              step: 2
              on_change: "change_font_size"

          - type: "View"
            name: "Divider"
            style:
              height: 1
              background_color: "{{colors.border}}"
              margin_horizontal: 24

          - type: "Component"
            component_ref: "settings_item_on_off"
            props:
              icon: "scroll"
              label: "Show Qumran Variants"
              description: "Highlight Dead Sea Scrolls text differences"
              value: "{{settings.show_qumran}}"
              on_change: "toggle_qumran"

          - type: "View"
            name: "Divider"
            style:
              height: 1
              background_color: "{{colors.border}}"
              margin_horizontal: 24

          - type: "Component"
            component_ref: "settings_item_on_off"
            props:
              icon: "book-open"
              label: "Show Full Chapter"
              description: "Display all verses in chapter"
              value: "{{settings.show_full_chapter}}"
              on_change: "toggle_full_chapter"

          - type: "View"
            name: "Divider"
            style:
              height: 1
              background_color: "{{colors.border}}"
              margin_horizontal: 24

          - type: "Component"
            component_ref: "settings_item_on_off"
            props:
              icon: "languages"
              label: "Hebrew Only Mode"
              description: "Hide English translation"
              value: "{{settings.hebrew_only}}"
              on_change: "toggle_hebrew_only"

  # =============================================================================
  # COMPONENTS: SETTINGS ITEMS
  # =============================================================================
  settings_section_header:
    name: "SettingsSectionHeader"
    container:
      type: "View"
      style:
        padding_horizontal: 24
        padding_vertical: 12

    children:
      - type: "Text"
        text: "{{props.text}}"
        style:
          font_family: "{{fonts.latin_ui}}"
          font_size: 12
          font_weight: "{{weights.semibold}}"
          color: "{{colors.text_secondary}}"
          text_transform: "uppercase"
          letter_spacing: 0.5

  settings_item_toggle:
    name: "SettingsItemToggle"
    description: "Settings row with pill toggle (80×40px)"

    container:
      type: "View"
      style:
        padding_horizontal: 24
        padding_vertical: 16
        flex_direction: "row"
        align_items: "center"
        justify_content: "space-between"

    children:
      - type: "View"
        name: "LeftContent"
        style:
          flex_direction: "row"
          align_items: "center"
          gap: 16
          flex: 1

        children:
          - type: "Icon"
            name: "{{props.icon}}"
            size: 24
            color: "{{colors.text_secondary}}"

          - type: "View"
            style:
              flex: 1

            children:
              - type: "Text"
                name: "Label"
                text: "{{props.label}}"
                style:
                  font_family: "{{fonts.latin_ui}}"
                  font_size: 16
                  font_weight: "{{weights.semibold}}"
                  color: "{{colors.text_primary}}"

              - type: "Text"
                name: "Description"
                text: "{{props.description}}"
                style:
                  font_family: "{{fonts.latin_ui}}"
                  font_size: 14
                  color: "{{colors.text_secondary}}"
                  margin_top: 2

      - type: "Component"
        component_ref: "pill_toggle"
        props:
          value: "{{props.value}}"
          on_change: "{{props.on_change}}"

  pill_toggle:
    name: "PillToggle"
    description: "Retro pill-shaped toggle switch (80×40px)"

    container:
      type: "TouchableOpacity"
      on_press: "{{props.on_change}}"
      active_opacity: 0.8
      style:
        width: 80
        height: 40
        border_radius: "{{border_radius.full}}"
        background_color: "{{colors.border}}"
        padding: 2
        justify_content: "center"
        shadow_color: "#000"
        shadow_offset:
          width: 0
          height: 1
        shadow_opacity: 0.15
        shadow_radius: 2

    children:
      - type: "Animated.View"
        name: "SlidingPill"
        style:
          width: 38
          height: 36
          border_radius: "{{border_radius.full}}"
          background_color: "{{props.value ? colors.primary : colors.surface}}"
          border_width: 2
          border_color: "{{props.value ? colors.primary_deep : colors.border}}"
          shadow_color: "{{props.value ? colors.primary : '#000'}}"
          shadow_offset:
            width: 0
            height: 2
          shadow_opacity: "{{props.value ? 0.3 : 0.1}}"
          shadow_radius: 4

        animation:
          property: "translateX"
          to_value: "{{props.value ? 40 : 0}}"
          duration: 300
          easing: "ease_out"

  settings_item_on_off:
    name: "SettingsItemOnOff"
    description: "Settings row with circular ON/OFF button (64px)"

    container:
      type: "View"
      style:
        padding_horizontal: 24
        padding_vertical: 16
        flex_direction: "row"
        align_items: "center"
        justify_content: "space-between"

    children:
      - type: "View"
        name: "LeftContent"
        style:
          flex_direction: "row"
          align_items: "center"
          gap: 16
          flex: 1

        children:
          - type: "Icon"
            name: "{{props.icon}}"
            size: 24
            color: "{{colors.text_secondary}}"

          - type: "View"
            style:
              flex: 1

            children:
              - type: "Text"
                text: "{{props.label}}"
                style:
                  font_family: "{{fonts.latin_ui}}"
                  font_size: 16
                  font_weight: "{{weights.semibold}}"
                  color: "{{colors.text_primary}}"

              - type: "Text"
                text: "{{props.description}}"
                style:
                  font_family: "{{fonts.latin_ui}}"
                  font_size: 14
                  color: "{{colors.text_secondary}}"
                  margin_top: 2

      - type: "Component"
        component_ref: "on_off_button"
        props:
          value: "{{props.value}}"
          on_change: "{{props.on_change}}"

  on_off_button:
    name: "OnOffButton"
    description: "Vintage audio equipment style ON/OFF button (64px width)"

    container:
      type: "TouchableOpacity"
      on_press: "{{props.on_change}}"
      active_opacity: 0.8
      style:
        width: 64
        align_items: "center"
        gap: 8

    children:
      - type: "View"
        name: "CircularButton"
        style:
          width: 56
          height: 56
          border_radius: "{{border_radius.full}}"
          background_color: "{{props.value ? colors.primary : colors.surface}}"
          border_width: 3
          border_color: "{{props.value ? colors.primary_deep : colors.border}}"
          justify_content: "center"
          align_items: "center"
          shadow_color: "{{props.value ? colors.primary : '#000'}}"
          shadow_offset:
            width: 0
            height: "{{props.value ? 0 : 2}}"
          shadow_opacity: "{{props.value ? 0.4 : 0.1}}"
          shadow_radius: "{{props.value ? 12 : 4}}"

        children:
          - type: "View"
            name: "InnerLightIndicator"
            style:
              width: 24
              height: 24
              border_radius: "{{border_radius.full}}"
              background_color: "{{props.value ? '#FFFFFF' : colors.text_secondary}}"
              opacity: "{{props.value ? 0.9 : 0.2}}"
              shadow_color: "{{props.value ? '#FFFFFF' : 'transparent'}}"
              shadow_offset:
                width: 0
                height: 0
              shadow_opacity: "{{props.value ? 0.8 : 0}}"
              shadow_radius: 12

      - type: "Text"
        name: "OnOffLabel"
        text: "{{props.value ? 'ON' : 'OFF'}}"
        style:
          font_family: "{{fonts.latin_ui}}"
          font_size: 12
          font_weight: "{{weights.bold}}"
          color: "{{props.value ? colors.primary : colors.text_secondary}}"
          letter_spacing: 1

  settings_item_slider:
    name: "SettingsItemSlider"
    description: "Settings row with slider for numeric values"

    container:
      type: "View"
      style:
        padding_horizontal: 24
        padding_vertical: 16

    children:
      - type: "View"
        name: "Header"
        style:
          flex_direction: "row"
          align_items: "center"
          gap: 16
          margin_bottom: 16

        children:
          - type: "Icon"
            name: "{{props.icon}}"
            size: 24
            color: "{{colors.text_secondary}}"

          - type: "View"
            style:
              flex: 1

            children:
              - type: "Text"
                text: "{{props.label}}"
                style:
                  font_family: "{{fonts.latin_ui}}"
                  font_size: 16
                  font_weight: "{{weights.semibold}}"
                  color: "{{colors.text_primary}}"

              - type: "Text"
                text: "{{props.description}}"
                style:
                  font_family: "{{fonts.latin_ui}}"
                  font_size: 14
                  color: "{{colors.text_secondary}}"
                  margin_top: 2

      - type: "View"
        name: "SliderContainer"
        style:
          margin_left: 40

        children:
          - type: "Slider"
            minimum_value: "{{props.min_value}}"
            maximum_value: "{{props.max_value}}"
            step: "{{props.step}}"
            value: "{{props.value}}"
            on_value_change: "{{props.on_change}}"
            minimum_track_tint_color: "{{colors.primary}}"
            maximum_track_tint_color: "{{colors.border}}"
            thumb_tint_color: "{{colors.primary}}"

          - type: "Text"
            name: "PreviewText"
            text: "בְּרֵאשִׁית"
            style:
              font_family: "{{fonts.hebrew_scripture}}"
              font_size: "{{props.value}}"
              color: "{{colors.text_primary}}"
              text_align: "center"
              margin_top: 12
              line_height: 1.8

# =============================================================================
# MODAL: BOOK SELECTOR
# =============================================================================
modals:
  book_selector:
    name: "BookSelectorModal"
    description: "Full-screen modal for selecting Bible book, chapter, verse"

    presentation:
      animation_type: "slide"
      from: "bottom"
      duration: 300
      transparent: true
      status_bar: "light"

    backdrop:
      background_color: "rgba(0, 0, 0, 0.5)"
      dismisses_on_tap: true

    container:
      style:
        width: "90%"
        max_height: "70%"
        background_color: "{{colors.surface}}"
        border_radius: "{{border_radius.xl}}"
        align_self: "center"
        margin_vertical: "auto"
        overflow: "hidden"
        shadow_color: "#000"
        shadow_offset:
          width: 0
          height: 8
        shadow_opacity: 0.3
        shadow_radius: 16
        elevation: 8

    header:
      type: "View"
      style:
        padding: 20
        border_bottom_width: 1
        border_bottom_color: "{{colors.border}}"
        flex_direction: "row"
        justify_content: "space-between"
        align_items: "center"

      components:
        - type: "Text"
          text: "Select Book"
          style:
            font_family: "{{fonts.latin_ui}}"
            font_size: 20
            font_weight: "{{weights.bold}}"
            color: "{{colors.text_primary}}"

        - type: "TouchableOpacity"
          on_press: "close_modal"
          style:
            width: 32
            height: 32
            border_radius: "{{border_radius.full}}"
            justify_content: "center"
            align_items: "center"

          children:
            - type: "Icon"
              name: "x"
              size: 24
              color: "{{colors.text_secondary}}"

    content:
      type: "ScrollView"
      style:
        flex: 1

      show_vertical_scroll_indicator: true

      children:
        - type: "View"
          name: "BooksList"
          style:
            padding: 20

          children:
            - type: "FlatList"
              data: "{{books}}"
              gap: 12

              item_render:
                type: "TouchableOpacity"
                on_press: "select_book"
                on_press_data: "{{item}}"
                active_opacity: 0.7
                style:
                  padding: 16
                  background_color: "{{item.is_selected ? colors.primary_light : colors.surface_elevated}}"
                  border_radius: "{{border_radius.md}}"
                  border_width: 1
                  border_color: "{{item.is_selected ? colors.primary : colors.border}}"

                children:
                  - type: "View"
                    style:
                      flex_direction: "row"
                      justify_content: "space-between"
                      align_items: "center"

                    children:
                      - type: "Text"
                        text: "{{item.name_english}}"
                        style:
                          font_family: "{{fonts.latin_ui}}"
                          font_size: 16
                          font_weight: "{{weights.medium}}"
                          color: "{{item.is_selected ? colors.primary : colors.text_primary}}"

                      - type: "Text"
                        text: "{{item.name_hebrew}}"
                        style:
                          font_family: "{{fonts.hebrew_ui}}"
                          font_size: 14
                          color: "{{colors.text_secondary}}"
                          text_align: "right"
                          writing_direction: "rtl"

  # =============================================================================
  # COMPONENT: BOTTOM NAVIGATION BAR
  # =============================================================================
  bottom_navigation:
    name: "BottomNavigationBar"
    description: "Fixed bottom tab bar with 4 tabs and swipe separator line"

    container:
      type: "View"
      style:
        position: "absolute"
        bottom: 0
        left: 0
        right: 0

    structure:
      - section: "separator_line"
      - section: "nav_bar"

    sections:
      separator_line:
        type: "View"
        style:
          height: 1
          background_color: "#999999"

      nav_bar:
        type: "View"
        style:
          flex_direction: "row"
          background_color: "{{colors.surface}}"
          padding_bottom: "{{safe_areas.ios.bottom}}" # iOS gesture bar space
          height: "{{64 + safe_areas.ios.bottom}}"
          border_top_width: 0 # Separator line above handles this
          shadow_color: "#000"
          shadow_offset:
            width: 0
            height: -2
          shadow_opacity: 0.05
          shadow_radius: 8
          elevation: 8

        children:
          - type: "Component"
            component_ref: "nav_tab"
            props:
              icon: "book-open"
              label: "Home"
              route: "Home"
              is_active: "{{current_route === 'Home'}}"

          - type: "Component"
            component_ref: "nav_tab"
            props:
              icon: "search"
              label: "Search"
              route: "Search"
              is_active: "{{current_route === 'Search'}}"

          - type: "Component"
            component_ref: "nav_tab"
            props:
              icon: "bookmark"
              label: "Saved"
              route: "Bookmarks"
              is_active: "{{current_route === 'Bookmarks'}}"

          - type: "Component"
            component_ref: "nav_tab"
            props:
              icon: "settings"
              label: "Settings"
              route: "Settings"
              is_active: "{{current_route === 'Settings'}}"

  nav_tab:
    name: "NavigationTab"
    description: "Individual bottom nav tab with icon and label"

    container:
      type: "TouchableOpacity"
      on_press: "navigate_to_route"
      on_press_data: "{{props.route}}"
      active_opacity: 0.7
      style:
        flex: 1
        align_items: "center"
        justify_content: "center"
        padding_vertical: 8
        gap: 4

    children:
      - type: "Icon"
        name: "{{props.icon}}"
        size: 24
        color: "{{props.is_active ? colors.primary : colors.text_secondary}}"

      - type: "Text"
        text: "{{props.label}}"
        style:
          font_family: "{{fonts.latin_ui}}"
          font_size: 12
          font_weight: "{{props.is_active ? weights.medium : weights.regular}}"
          color: "{{props.is_active ? colors.primary : colors.text_secondary}}"

# =============================================================================
# NAVIGATION CONFIGURATION
# =============================================================================
navigation:
  type: "stack"

  screens:
    - name: "Splash"
      component: "SplashScreen"
      options:
        header_shown: false

    - name: "Main"
      component: "BottomTabNavigator"
      options:
        header_shown: false

    - name: "VerseDetail"
      component: "VerseDetailScreen"
      options:
        header_shown: false
        animation: "slide_from_right"
        gesture_enabled: true

  bottom_tabs:
    - name: "Home"
      component: "HomeScreen"
      icon: "book-open"

    - name: "Search"
      component: "SearchScreen"
      icon: "search"

    - name: "Bookmarks"
      component: "BookmarksScreen"
      icon: "bookmark"

    - name: "Settings"
      component: "SettingsScreen"
      icon: "settings"

  initial_route: "Splash"

# =============================================================================
# DATA MODELS
# =============================================================================
data_models:
  verse:
    book: "string" # "Genesis"
    book_hebrew: "string" # "בראשית"
    chapter: "number" # 1
    verse: "number" # 1
    hebrew_text: "string" # Full Hebrew with nikud
    translation: "string" # English translation
    words: "array<word>" # Array of word objects
    qumran_variants: "array" # Array of variant differences
    is_bookmarked: "boolean"

  word:
    hebrew: "string" # "בְּרֵאשִׁית"
    transliteration: "string" # "bereshit"
    meanings: "array<string>" # ["in beginning", "at first"]
    root: "string" # "ראש"
    root_transliteration: "string" # "rosh"
    root_meaning: "string" # "head, beginning, chief"
    instances: "array<verse_reference>"
    has_qumran_variant: "boolean"

  verse_reference:
    verse: "string" # "Gen 1:1"
    text: "string" # Snippet

# =============================================================================
# STATE MANAGEMENT
# =============================================================================
app_state:
  theme: "light | dark"
  language: "en | es | he"
  hebrew_font_size: 48 # 36-56 range
  show_qumran: false
  show_full_chapter: false
  hebrew_only: false
  current_verse:
    book: "Genesis"
    chapter: 1
    verse: 1
  recent_verses: "array<verse>"
  bookmarks: "array<verse>"

# =============================================================================
# IMPLEMENTATION NOTES
# =============================================================================
implementation_notes:
  - "Use react-native-reanimated for smooth 60fps animations"
  - "Use react-native-gesture-handler for swipe gestures on verse screen"
  - "Use @gorhom/bottom-sheet for word analysis bottom sheet"
  - "Use react-native-safe-area-context for safe area insets"
  - "Use AsyncStorage for persisting settings and recent verses"
  - "Hebrew fonts: Bundle Cardo.ttf in assets/fonts/"
  - "All measurements in logical pixels (pt), will scale to @2x/@3x automatically"
  - "Test on both iOS Simulator and Android Emulator"
  - "Ensure Hebrew text renders correctly with nikud (vowel points)"
  - "Use Platform.select() for platform-specific shadow vs elevation"
  - "Debounce search input by 300ms to avoid excessive re-renders"
  - "Use FlatList for verse lists (performance with large data)"
  - "Memoize Hebrew word components to prevent unnecessary re-renders"
