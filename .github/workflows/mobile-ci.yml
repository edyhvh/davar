name: Mobile CI

on:
  push:
    branches: [main, apocalipsis]
    paths: ["mobile/**", "shared/**", ".github/workflows/mobile-ci.yml"]
  pull_request:
    branches: [main, apocalipsis]
    paths: ["mobile/**", "shared/**", ".github/workflows/mobile-ci.yml"]

jobs:
  mobile_ci:
    name: mobile-ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: |
          cd mobile
          bun install

      - name: Run lint
        run: |
          cd mobile
          bun run lint

      - name: Check TypeScript
        run: |
          cd mobile
          bun run typecheck
